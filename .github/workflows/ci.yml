name: CI with Cypress

on:
  push:
    branches:
      - start

  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL for Cypress tests"
        required: true
        default: https://docker-test.onrender.com

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Wait for app to be ready
        run: npx wait-on ${{ github.event.inputs.base_url || 'https://docker-test.onrender.com' }}

      - name: Run Cypress tests
        env:
          CYPRESS_BASE_URL: ${{ github.event.inputs.base_url || 'https://docker-test.onrender.com' }}
        run: npx cypress run