name: CI with Cypress

on:
  push:
    branches:
      - start

  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL for Cypress tests"
        required: false
        default: "https://docker-test.onrender.com"

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set BASE_URL
        run: echo "BASE_URL=${{ github.event.inputs.base_url || 'https://docker-test.onrender.com' }}" >> $GITHUB_ENV

      - name: Wait for app to be ready
        run: npx wait-on $BASE_URL

      - name: Run Cypress tests
        env:
          CYPRESS_BASE_URL: ${{ env.BASE_URL }}
        run: npx cypress run