name: CI with Cypress

on:
  push:
    branches:
      - start

  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL for Cypress tests"
        required: false
        default: "https://doker-test-production.up.railway.app"

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Set BASE_URL
        run: echo "BASE_URL=${{ github.event.inputs.base_url || 'https://doker-test-production.up.railway.app' }}" >> $GITHUB_ENV