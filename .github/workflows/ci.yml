name: CI

on:
  workflow_dispatch:
    inputs:
      run_cypress:
        description: "Run Cypress E2E tests"
        required: true
        default: "true"

jobs:
  cypress-tests:
    if: ${{ github.event.inputs.run_cypress == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Start app
        run: npm run dev &

      - name: Wait for app
        run: npx wait-on http://localhost:3000

      - name: Run Cypress tests
        run: npx cypress run
