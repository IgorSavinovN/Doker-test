version: '3.9'

services:
  app:
    image: node:20
    working_dir: /app
    volumes:
      - .:/app:cached
    command: ["sh", "-c", "npm install && npm run dev"]
    ports:
      - "3000:3000"

  cypress:
    image: cypress/included:12.15.0
    depends_on:
      - app
    working_dir: /app
    volumes:
      - .:/app:cached
    command: ["npx", "cypress", "run"]